# Builds Pomodoro.dmg and publishes it as a GitHub Release.
#
# - Push a version tag to release:   git tag v1.0.0 && git push origin v1.0.0
# - Or run it by hand from the Actions tab to get a test .dmg (no Release).
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # macOS 26 SDK is needed for the Liquid Glass APIs.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history, so the build number (commit count) is right

      - name: Work out the version
        id: version
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0-dev.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build universal app
        run: VERSION="${{ steps.version.outputs.version }}" ./scripts/bundle.sh

      # --- Signing & notarization (later, with an Apple Developer account) ---
      # Add these repository secrets, then uncomment:
      #   MACOS_CERT_P12 (base64 Developer ID Application .p12), MACOS_CERT_PASSWORD,
      #   APPLE_ID, APPLE_TEAM_ID, APPLE_APP_PASSWORD (app-specific password)
      # - name: Sign with Developer ID
      #   run: |
      #     echo "$MACOS_CERT_P12" | base64 --decode > cert.p12
      #     security create-keychain -p ci build.keychain
      #     security import cert.p12 -k build.keychain -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
      #     security set-key-partition-list -S apple-tool:,apple: -s -k ci build.keychain
      #     security list-keychains -s build.keychain
      #     security unlock-keychain -p ci build.keychain
      #     codesign --force --options runtime --timestamp \
      #       --sign "Developer ID Application" Pomodoro.app
      # ------------------------------------------------------------------------

      - name: Make disk image
        run: ./scripts/make_dmg.sh

      # - name: Notarize
      #   run: |
      #     xcrun notarytool submit dist/*.dmg --apple-id "$APPLE_ID" \
      #       --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --wait
      #     xcrun stapler staple dist/*.dmg

      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.dmg --title "Pomodoro ${{ steps.version.outputs.version }}" --generate-notes

      - name: Upload test build
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: Pomodoro-${{ steps.version.outputs.version }}
          path: dist/*.dmg
